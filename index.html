<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0f14" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>翻译</title>
<style>
  :root {
    --bg: #f2f4f7;
    --card: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --primary: #2563eb;
    --primary-press: #1d4ed8;
    --danger: #dc2626;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(17, 24, 39, .04), 0 8px 24px rgba(17, 24, 39, .04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f14;
      --card: #151b23;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --border: #2a3441;
      --primary: #3b82f6;
      --primary-press: #2563eb;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  body { min-height: 100vh; }
  .app {
    max-width: 680px;
    margin: 0 auto;
    padding: 0 16px calc(28px + env(safe-area-inset-bottom));
  }
  .bar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    background: var(--bg);
    border-bottom: 1px solid transparent;
  }
  .bar-left { display: flex; align-items: center; gap: 8px; }
  .title { font-size: 17px; font-weight: 650; letter-spacing: .01em; }
  .badge {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 7px;
  }
  .icon-btn {
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    font-size: 18px;
    line-height: 1;
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .icon-btn:active { background: rgba(107, 114, 128, .14); }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-top: 12px;
    box-shadow: var(--shadow);
  }
  .label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 8px;
    letter-spacing: .02em;
  }
  textarea {
    display: block;
    width: 100%;
    min-height: 128px;
    resize: vertical;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 17px;
    line-height: 1.5;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, .12);
  }
  textarea::placeholder { color: var(--muted); opacity: .75; }
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
  }
  .row .spacer { flex: 1; }
  .muted { color: var(--muted); font-size: 13px; }
  select {
    flex: 1;
    min-width: 0;
    height: 44px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card);
    color: var(--text);
    padding: 0 12px;
    font: inherit;
    font-size: 16px;
    outline: none;
  }
  select:focus { border-color: var(--primary); }
  .detected {
    flex: 1;
    min-width: 0;
    height: 44px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 12px;
    border: 1px dashed var(--border);
    border-radius: 12px;
    background: rgba(107, 114, 128, .07);
    color: var(--muted);
    font-size: 15px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .detected.is-detected {
    border-style: solid;
    color: var(--text);
    background: var(--card);
  }
  button {
    font: inherit;
    border: 0;
    border-radius: 12px;
    height: 44px;
    padding: 0 18px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    touch-action: manipulation;
    transition: background .15s, opacity .15s, transform .05s;
  }
  button:active:not(:disabled) { transform: scale(.985); }
  .primary { background: var(--primary); color: #fff; }
  .primary:active:not(:disabled) { background: var(--primary-press); }
  .primary:disabled { opacity: .42; cursor: not-allowed; }
  .ghost {
    background: transparent;
    color: var(--primary);
    border: 1px solid var(--border);
    height: 36px;
    padding: 0 12px;
    font-size: 14px;
    font-weight: 500;
  }
  .controls {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 10px;
    margin-top: 12px;
  }
  .controls .wide { grid-column: 1 / -1; }
  .arrow {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 44px;
    min-width: 18px;
    color: var(--muted);
    font-size: 17px;
    line-height: 1;
  }
  .arrow::before { content: "→"; }
  .result-text {
    min-height: 76px;
    padding: 12px;
    border-radius: 12px;
    background: rgba(107, 114, 128, .07);
    font-size: 17px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .result-text.empty { color: var(--muted); }
  .status { flex: 1; min-width: 0; }
  .status.error { color: var(--danger); }
  .hint {
    margin: 18px 4px 0;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.6;
  }
  .hint code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    background: rgba(107, 114, 128, .12);
    padding: 1px 5px;
    border-radius: 5px;
  }
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom));
    z-index: 100;
    max-width: calc(100vw - 48px);
    padding: 10px 16px;
    border-radius: 999px;
    background: rgba(17, 24, 39, .93);
    color: #fff;
    font-size: 14px;
    line-height: 1.4;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transform: translateX(-50%) translateY(16px);
    transition: opacity .2s, transform .2s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .done {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(17, 24, 39, .32);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease;
  }
  .done.show { opacity: 1; }
  .done-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    min-width: 176px;
    max-width: 280px;
    padding: 26px 30px 24px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 22px;
    box-shadow: 0 18px 48px rgba(17, 24, 39, .22);
    transform: scale(.88);
    transition: transform .22s cubic-bezier(.24, 1.24, .42, 1);
  }
  .done.show .done-card { transform: scale(1); }
  .done-icon {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(34, 197, 94, .14);
    display: grid;
    place-items: center;
  }
  .done-icon svg {
    width: 32px;
    height: 32px;
    stroke: #16a34a;
    stroke-width: 2.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
    stroke-dasharray: 30;
    stroke-dashoffset: 30;
  }
  .done.show .done-icon svg {
    animation: done-check .34s ease .08s forwards;
  }
  @keyframes done-check { to { stroke-dashoffset: 0; } }
  .done-text {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.45;
    color: var(--text);
    text-align: center;
    word-break: break-word;
  }
  @media (prefers-color-scheme: dark) {
    .done { background: rgba(0, 0, 0, .5); }
    .done-icon { background: rgba(34, 197, 94, .18); }
    .done-icon svg { stroke: #4ade80; }
  }
  @media (max-width: 360px) {
    .controls { grid-template-columns: 1fr; }
    .controls .wide { grid-column: auto; }
    .arrow { height: 20px; }
    .arrow::before { content: "↓"; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="bar-left">
      <span class="title">翻译</span>
      <span class="badge">在线</span>
    </div>
    <button class="icon-btn" id="closeBtn" type="button" aria-label="关闭">✕</button>
  </header>

  <main>
    <section class="card">
      <div class="label">
        <span>原文</span>
        <span class="muted" id="count">0 字</span>
      </div>
      <textarea id="source" placeholder="粘贴或输入要翻译的句子…" rows="4" autocapitalize="sentences" autocomplete="off" spellcheck="false"></textarea>
      <div class="row">
        <button class="ghost" id="pasteBtn" type="button">读取剪贴板</button>
        <button class="ghost" id="clearBtn" type="button">清空</button>
        <span class="spacer"></span>
        <span class="muted" id="prefill"></span>
      </div>
    </section>

    <div class="controls">
      <div class="detected" id="detected">自动识别</div>
      <span class="arrow" aria-hidden="true"></span>
      <select id="target" aria-label="目标语言">
        <option value="en" selected>英语</option>
        <option value="fr">法语</option>
        <option value="de">德语</option>
        <option value="es">西班牙语</option>
        <option value="ar">阿拉伯语</option>
        <option value="zh-CN">中文简体</option>
      </select>
      <button class="primary wide" id="translateBtn" type="button">翻译</button>
    </div>

    <section class="card">
      <div class="label"><span>译文</span></div>
      <div class="result-text empty" id="result" dir="auto" aria-live="polite">译文会显示在这里</div>
      <div class="row">
        <span class="status muted" id="status"></span>
        <button class="primary" id="copyBtn" type="button" disabled>复制</button>
      </div>
    </section>

    <p class="hint">
      文本会发送到第三方翻译服务，请勿翻译敏感信息。
    </p>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="done" id="done" role="status" aria-live="polite">
  <div class="done-card">
    <div class="done-icon">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12.6l4.6 4.6L19.5 6.8"/></svg>
    </div>
    <div class="done-text" id="doneText">已复制，关闭后粘贴到聊天框</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var CONFIG = {
    // 自建代理：百度翻译 + 假发术语表，失败时自动回退 MyMemory。
    // 页面会 POST { text, source, target }，并读取 { translation }。
    endpoint: 'https://translate-proxy-ynexjuqsls.cn-hangzhou.fcapp.run/translate'
  };

  var $ = function (id) { return document.getElementById(id); };
  var source = $('source');
  var result = $('result');
  var copyBtn = $('copyBtn');
  var translateBtn = $('translateBtn');
  var statusEl = $('status');
  var countEl = $('count');
  var prefillEl = $('prefill');
  var targetEl = $('target');
  var detectedEl = $('detected');
  var pasteBtn = $('pasteBtn');
  var clearBtn = $('clearBtn');
  var closeBtn = $('closeBtn');
  var toastEl = $('toast');
  var doneEl = $('done');
  var doneTextEl = $('doneText');

  var translated = '';
  var toastTimer = null;
  var doneTimer = null;
  var loading = false;

  var STORAGE_TARGET = 'translate.target';

  // 目标语言下拉的取值 → 中文名；接口回传的识别结果也用同一张表翻译
  var LANG_NAMES = {
    'zh-CN': '中文简体', zh: '中文简体', en: '英语', fr: '法语', de: '德语',
    es: '西班牙语', ar: '阿拉伯语', ja: '日语', ko: '韩语', ru: '俄语',
    pt: '葡萄牙语', it: '意大利语', nl: '荷兰语', pl: '波兰语', tr: '土耳其语',
    th: '泰语', vi: '越南语', id: '印尼语'
  };

  function langName(code) {
    return LANG_NAMES[code] || code || '未知语言';
  }

  function resetDetected() {
    detectedEl.classList.remove('is-detected');
    detectedEl.textContent = '自动识别';
  }

  function savePref(name, value) {
    try { localStorage.setItem(name, value); } catch (e) {}
  }

  function restorePrefs() {
    try {
      var savedTarget = localStorage.getItem(STORAGE_TARGET);
      if (savedTarget && targetEl.querySelector('option[value="' + savedTarget + '"]')) {
        targetEl.value = savedTarget;
      }
    } catch (e) {}
  }

  function toast(message, ms) {
    toastEl.textContent = message;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
    }, ms || 2200);
  }

  function showDone(message, ms) {
    doneTextEl.textContent = message || '已复制，关闭后粘贴到聊天框';
    doneEl.classList.remove('show');
    void doneEl.offsetWidth;
    doneEl.classList.add('show');
    clearTimeout(doneTimer);
    doneTimer = setTimeout(function () {
      doneEl.classList.remove('show');
    }, ms || 900);
  }

  function updateCount() {
    countEl.textContent = source.value.length + ' 字';
  }

  function resetResult() {
    translated = '';
    result.textContent = '译文会显示在这里';
    result.classList.add('empty');
    copyBtn.disabled = true;
    statusEl.textContent = '';
    statusEl.classList.remove('error');
    resetDetected();
  }

  function markStale() {
    if (translated) {
      resetResult();
      statusEl.textContent = '原文已修改，请重新翻译';
    }
  }

  function decodeEntities(value) {
    var textarea = document.createElement('textarea');
    textarea.innerHTML = value;
    return textarea.value;
  }

  // 接口没回传识别结果时的本地粗判（也用于 MyMemory 兜底，它不支持 auto）
  function guessSource(text) {
    if (/[\u3400-\u9fff\uf900-\ufaff]/.test(text)) return 'zh-CN';
    if (/[\u0600-\u06ff]/.test(text)) return 'ar';
    if (/[\u3040-\u30ff]/.test(text)) return 'ja';
    if (/[\uac00-\ud7af]/.test(text)) return 'ko';
    if (/[\u0400-\u04ff]/.test(text)) return 'ru';
    return 'en';
  }

  function fetchJson(url, options, timeoutMs, label) {
    var name = label || '在线翻译';
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, timeoutMs || 12000);
    var opts = Object.assign({}, options || {}, { signal: controller.signal });
    function fail(error) {
      clearTimeout(timer);
      if (error && error.name === 'AbortError') {
        throw new Error('请求超时，请检查网络后重试');
      }
      throw error;
    }
    return fetch(url, opts).then(function (response) {
      if (!response.ok) {
        throw new Error(name + '失败（HTTP ' + response.status + '）');
      }
      return response.json();
    }).then(function (data) {
      clearTimeout(timer);
      return data;
    }, fail);
  }

  function translateWithEndpoint(text, target) {
    return fetchJson(CONFIG.endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text, source: 'auto', target: target })
    }, 12000, '翻译服务').then(function (data) {
      var output = data && (data.translation || (data.data && data.data.translation));
      if (!output) throw new Error('翻译服务没有返回 translation');
      return { text: output, detected: (data.source || '') };
    });
  }

  function translateWithMyMemory(text, source, target) {
    var pair = source + '|' + target;
    var url = 'https://api.mymemory.translated.net/get?q=' +
      encodeURIComponent(text) + '&langpair=' + encodeURIComponent(pair);
    return fetchJson(url, { headers: { Accept: 'application/json' } }, 15000).then(function (data) {
      var status = data && String(data.responseStatus || '');
      var output = data && data.responseData && data.responseData.translatedText;
      if (data && (data.quotaFinished || status === '403')) {
        throw new Error('MyMemory 免费额度已用完');
      }
      if (!output) throw new Error('在线翻译没有返回结果');
      if (/MYMEMORY WARNING|QUOTA/i.test(output)) {
        throw new Error('MyMemory 免费额度已用完');
      }
      return decodeEntities(output);
    });
  }

  function performTranslate(text, target) {
    var guess = guessSource(text);

    function makeResult(output, detected, note) {
      return {
        text: output,
        detected: detected,
        note: note || (detected === target ? '原文已是' + langName(target) : '翻译完成')
      };
    }

    if (CONFIG.endpoint) {
      return translateWithEndpoint(text, target).then(function (out) {
        return makeResult(out.text, out.detected || guess);
      }, function (error) {
        // 自建接口不可用（域名解析失败 / 额度用尽 / 网络异常）时改用备用引擎，
        // 不让整页翻译失效；两条都失败才把两段原因一起显示。
        var first = error && error.message ? error.message : '接口调用失败';
        return translateWithMyMemory(text, guess, target).then(function (output) {
          return makeResult(output, guess, '主接口不可用，已改用备用引擎');
        }, function (error2) {
          throw new Error(first + '；' + (error2 && error2.message ? error2.message : '备用引擎也失败'));
        });
      });
    }
    return translateWithMyMemory(text, guess, target).then(function (output) {
      return makeResult(output, guess);
    }).catch(function (error) {
      throw new Error((error && error.message ? error.message : '翻译失败') + '。请检查网络后重试。');
    });
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text).then(function () {
        return true;
      }).catch(function () {
        return fallbackCopy(text);
      });
    }
    return Promise.resolve(fallbackCopy(text));
  }

  function fallbackCopy(text) {
    var textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.setAttribute('readonly', '');
    textarea.style.position = 'fixed';
    textarea.style.top = '-1000px';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    textarea.setSelectionRange(0, textarea.value.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(textarea);
    return ok;
  }

  function setLoading(value) {
    loading = value;
    translateBtn.disabled = value;
    translateBtn.textContent = value ? '翻译中…' : '翻译';
  }

  translateBtn.addEventListener('click', function () {
    if (loading) return;
    var text = source.value.trim();
    if (!text) {
      toast('请先输入或粘贴要翻译的内容');
      source.focus();
      return;
    }

    var target = targetEl.value;

    setLoading(true);
    resetResult();
    detectedEl.textContent = '识别中…';
    statusEl.textContent = '正在识别语种并翻译…';

    performTranslate(text, target).then(function (output) {
      translated = output.text;
      result.textContent = output.text;
      result.classList.remove('empty');
      copyBtn.disabled = false;
      detectedEl.textContent = langName(output.detected);
      detectedEl.classList.add('is-detected');
      statusEl.textContent = output.note + ' · ' +
        langName(output.detected) + ' → ' + langName(target);
      statusEl.classList.remove('error');
    }).catch(function (error) {
      translated = '';
      copyBtn.disabled = true;
      result.textContent = '翻译失败，请稍后重试';
      result.classList.add('empty');
      resetDetected();
      statusEl.textContent = error && error.message ? error.message : '翻译失败';
      statusEl.classList.add('error');
    }).then(function () {
      setLoading(false);
    });
  });

  copyBtn.addEventListener('click', function () {
    if (!translated) return;
    copyText(translated).then(function (ok) {
      if (ok) {
        showDone('已复制，关闭后粘贴到聊天框');
      } else {
        toast('复制失败，请长按译文手动复制');
      }
    });
  });

  pasteBtn.addEventListener('click', function () {
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function (text) {
        if (!text) {
          toast('剪贴板是空的');
          return;
        }
        source.value = text;
        updateCount();
        markStale();
        toast('已从剪贴板读取');
      }).catch(function () {
        source.focus();
        toast('无法自动读取，请长按输入框选择“粘贴”');
      });
      return;
    }
    source.focus();
    toast('无法自动读取，请长按输入框选择“粘贴”');
  });

  clearBtn.addEventListener('click', function () {
    source.value = '';
    prefillEl.textContent = '';
    updateCount();
    resetResult();
    source.focus();
  });

  closeBtn.addEventListener('click', function () {
    window.close();
    setTimeout(function () {
      toast('如果页面没有关闭，请点系统自带的“完成”');
    }, 260);
  });

  source.addEventListener('input', function () {
    updateCount();
    markStale();
  });

  targetEl.addEventListener('change', function () {
    savePref(STORAGE_TARGET, targetEl.value);
    var hadResult = !!translated;
    resetResult();
    if (hadResult) statusEl.textContent = '目标语言已切换，请重新翻译';
  });

  var params = new URLSearchParams(window.location.search);
  var initial = params.get('text');
  if (!initial && window.location.hash.indexOf('#text=') === 0) {
    try { initial = decodeURIComponent(window.location.hash.slice(6)); } catch (e) { initial = ''; }
  }
  if (initial) {
    source.value = initial;
    prefillEl.textContent = '已从快捷指令带入';
  }
  restorePrefs();
  updateCount();
})();
</script>
</body>
</html>
